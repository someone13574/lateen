[package]
name = "lateen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings"] }
chrono = "0.4.45"
futures-lite = { version = "2.6.1", default-features = false }
gpui = { package = "gpui", git = "https://github.com/someone13574/gpui-ce", branch = "swash-hinting-bug", version = "0.2.2" }
gpui_platform = { git = "https://github.com/someone13574/gpui-ce", features = ["font-kit", "wayland", "x11"], branch = "swash-hinting-bug", version = "0.1.0" }
rust-embed = { version = "8.12.0", features = ["debug-embed", "include-exclude"] }
